[project]
name = "orders"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.163", "pydantic-settings>=2.12", "sqlalchemy>=2.1"]

[dependency-groups]
dev = ["httpx2>=2.16", "pytest>=9", "ruff>=0.17", "ty>=0.0.104"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"
