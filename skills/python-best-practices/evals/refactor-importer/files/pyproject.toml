[project]
name = "ledger"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pandas>=3.0", "pydantic>=2.14"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "ty>=0.0.104"]

[build-system]
requires = ["uv_build>=0.9"]
