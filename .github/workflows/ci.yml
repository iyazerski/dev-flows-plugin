name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifests and skills
        run: scripts/check.sh
      - name: Shellcheck
        run: shellcheck -s sh scripts/*.sh
